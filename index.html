<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Character Viewer</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
model-viewer{display:block;width:100%;height:100%;min-height:420px;background:transparent;--poster-color:transparent;outline:none}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:rgba(220,220,220,.8);pointer-events:none;text-shadow:0 1px 3px #222}
.wrap{position:relative;width:100%;height:100%;min-height:420px}
</style>
</head>
<body><div class="wrap">
<model-viewer src="./character.glb" alt="Low-poly blonde woman in a vintage brown fur-collar coat and tall boots" camera-controls touch-action="pan-y" interaction-prompt="auto" shadow-intensity="0.7" exposure="1" environment-image="neutral" camera-orbit="0deg 75deg 3.2m" min-camera-orbit="auto 20deg auto" max-camera-orbit="auto 150deg auto" field-of-view="30deg" disable-pan></model-viewer>
<div class="hint">Drag to rotate · Pinch or scroll to zoom</div>
</div></body></html>
